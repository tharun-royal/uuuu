<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logout - Smart Campus</title>

<style>

/* 🌸 BODY */
body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    overflow: hidden;
}

/* 🌸 ANIME FLOATING CIRCLES */
.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    animation: float 8s infinite ease-in-out;
}

.circle:nth-child(1) { width: 100px; height: 100px; top: 10%; left: 20%; }
.circle:nth-child(2) { width: 150px; height: 150px; top: 70%; left: 80%; }
.circle:nth-child(3) { width: 80px; height: 80px; top: 50%; left: 10%; }

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

/* 🌟 CARD */
.card {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

/* TEXT */
h1 {
    margin-bottom: 10px;
}

/* BUTTONS */
button {
    padding: 12px 20px;
    margin: 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
}

/* LOGOUT */
.logout-btn {
    background: #ff4d6d;
    color: white;
}

.logout-btn:hover {
    transform: scale(1.1);
}

/* CANCEL */
.cancel-btn {
    background: #4caf50;
    color: white;
}

.cancel-btn:hover {
    transform: scale(1.1);
}

/* HOME */
.home-btn {
    background: #2196f3;
    color: white;
}

.home-btn:hover {
    transform: scale(1.1);
}

</style>
</head>

<body>

<!-- 🌸 ANIMATION -->
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<!-- 🌟 CARD -->
<div class="card">
    <h1>🚪 Logout</h1>
    <p>Are you sure you want to logout?</p>

    <button class="logout-btn" onclick="logout()">Yes, Logout</button>
    <button class="cancel-btn" onclick="goDashboard()">Cancel</button>
    <button class="home-btn" onclick="goLogin()">Go to Login</button>
</div>

<script>

/* 🚪 LOGOUT */
function logout() {
    localStorage.clear();
    alert("You have logged out successfully!");
}

/* 🔙 BACK TO DASHBOARD */
function goDashboard() {
    window.location.href = "dashboard.html";
}

/* 🔐 GO LOGIN */
function goLogin() {
    window.location.href = "index.html";
}

</script>

</body>
</html>
