<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anime Reports Dashboard</title>

<style>

/* 🌸 BODY */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    transition: 0.4s;
}

/* 🌙 DARK MODE */
.dark {
    background: #121212;
    color: white;
}

/* 📌 SIDEBAR */
.sidebar {
    width: 240px;
    height: 100vh;
    background: rgba(0,0,0,0.7);
    position: fixed;
    color: white;
    padding: 20px;
}

.sidebar h2 {
    text-align: center;
}

.sidebar a {
    display: block;
    color: white;
    padding: 12px;
    text-decoration: none;
    border-radius: 8px;
    margin: 5px 0;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #ff7eb3;
}

/* 📌 MAIN */
.main {
    margin-left: 260px;
    padding: 20px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(12px);
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* STATS CARDS */
.stat {
    display: inline-block;
    width: 200px;
    padding: 20px;
    margin: 10px;
    border-radius: 15px;
    background: rgba(255,255,255,0.7);
    text-align: center;
    transition: 0.3s;
}

.stat:hover {
    transform: scale(1.08);
}

/* PROGRESS BAR */
.progress {
    width: 100%;
    background: #ddd;
    border-radius: 10px;
}

.progress-bar {
    height: 12px;
    background: #ff7eb3;
    border-radius: 10px;
}

/* CLOCK */
#clock {
    font-size: 16px;
}

button {
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #ff7eb3;
    color: white;
    cursor: pointer;
}

</style>
</head>

<body>

<!-- 🌸 SIDEBAR -->
<div class="sidebar">
    <h2>🌸 Campus</h2>

    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="students.html">👨‍🎓 Students</a>
    <a href="attendance.html">📅 Attendance</a>
    <a href="faculty.html">👨‍🏫 Faculty</a>
    <a href="courses.html">📚 Courses</a>
    <a href="#">📊 Reports</a>

    <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<!-- 🌸 MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <h1>📊 Reports Dashboard</h1>
        <div>
            <span id="clock"></span>
            <button onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="card">
        <div class="stat" id="studentsCount"></div>
        <div class="stat" id="facultyCount"></div>
        <div class="stat" id="coursesCount"></div>
        <div class="stat" id="attendanceCount"></div>
    </div>

    <!-- PROGRESS -->
    <div class="card">
        <h3>📈 Attendance Performance</h3>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- DETAILS -->
    <div class="card">
        <h3>📋 System Summary</h3>
        <p id="summary"></p>
    </div>

</div>

<script>

/* LOAD DATA */
let students = JSON.parse(localStorage.getItem("students")) || [];
let faculty = JSON.parse(localStorage.getItem("faculty")) || [];
let courses = JSON.parse(localStorage.getItem("courses")) || [];
let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

/* COUNTS */
document.getElementById("studentsCount").innerText = "👨‍🎓 Students\n" + students.length;
document.getElementById("facultyCount").innerText = "👨‍🏫 Faculty\n" + faculty.length;
document.getElementById("coursesCount").innerText = "📚 Courses\n" + courses.length;
document.getElementById("attendanceCount").innerText = "📅 Records\n" + attendance.length;

/* ATTENDANCE % */
let present = attendance.filter(a => a.status === "Present").length;
let percent = attendance.length ? Math.round((present / attendance.length) * 100) : 0;

document.getElementById("progressBar").style.width = percent + "%";

/* SUMMARY */
document.getElementById("summary").innerHTML =
    "Total Students: " + students.length + "<br>" +
    "Total Faculty: " + faculty.length + "<br>" +
    "Total Courses: " + courses.length + "<br>" +
    "Attendance %: " + percent + "%";

/* CLOCK */
function updateClock() {
    let now = new Date();
    document.getElementById("clock").innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);

/* DARK MODE */
function toggleTheme() {
    document.body.classList.toggle("dark");
}

/* LOGOUT */
function logout() {
    localStorage.clear();
    window.location.href = "index.html";
}

</script>

</body>
</html>
